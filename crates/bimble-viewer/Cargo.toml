[package]
name = "bimble-viewer"
description = "Bimble 3D viewer window"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = ["reference-plans"]
# DXF and PDF reference plans (ADR 0050): off in the web viewer build.
reference-plans = ["bimble-drawing/reference-plans"]

[dependencies]
bimble-drawing = { path = "../bimble-drawing", default-features = false }
bimble-api.workspace = true
bimble-core.workspace = true
bimble-geom.workspace = true
bimble-ifc.workspace = true
bimble-render.workspace = true
eframe.workspace = true
rfd.workspace = true
glam.workspace = true
serde_json.workspace = true
web-time.workspace = true
log.workspace = true
memory-stats.workspace = true

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen.workspace = true
wasm-bindgen-futures.workspace = true
js-sys.workspace = true
serde.workspace = true
web-sys = { workspace = true, features = ["Window", "Storage", "Document", "Element", "HtmlCanvasElement", "HtmlAnchorElement", "Blob", "Url", "Navigator", "BeforeUnloadEvent", "Event", "Location", "UrlSearchParams", "Response", "Performance"] }
