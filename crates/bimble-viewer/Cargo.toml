[package]
name = "bimble-viewer"
description = "Bimble 3D viewer window"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
bimble-drawing.workspace = true
bimble-core.workspace = true
bimble-geom.workspace = true
bimble-ifc.workspace = true
bimble-render.workspace = true
eframe.workspace = true
rfd.workspace = true
glam.workspace = true
serde_json.workspace = true
web-time.workspace = true
log.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen.workspace = true
wasm-bindgen-futures.workspace = true
js-sys.workspace = true
web-sys = { workspace = true, features = ["Window", "Document", "Element", "HtmlCanvasElement", "HtmlAnchorElement", "Blob", "Url", "Navigator", "BeforeUnloadEvent", "Event"] }
