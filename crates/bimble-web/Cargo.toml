[package]
name = "bimble-web"
description = "Bimble in a browser: the viewer compiled to WebAssembly"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[target.'cfg(target_arch = "wasm32")'.dependencies]
bimble-viewer.workspace = true
eframe.workspace = true
log.workspace = true
wasm-bindgen.workspace = true
wasm-bindgen-futures.workspace = true
web-sys = { workspace = true, features = ["Window", "Document", "Element", "HtmlCanvasElement", "console"] }
