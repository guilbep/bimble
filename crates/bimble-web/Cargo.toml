[package]
name = "bimble-web"
description = "Bimble in a browser: the viewer compiled to WebAssembly"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[features]
# Default: the small viewer. `--features editor`: everything, reference plans included (ADR 0050).
editor = ["bimble-viewer/reference-plans"]

[target.'cfg(target_arch = "wasm32")'.dependencies]
bimble-viewer = { path = "../bimble-viewer", default-features = false }
eframe.workspace = true
log.workspace = true
wasm-bindgen.workspace = true
wasm-bindgen-futures.workspace = true
web-sys = { workspace = true, features = ["Window", "Document", "Element", "HtmlCanvasElement", "console"] }
