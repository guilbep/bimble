[package]
name = "bimble-geom"
description = "Mesh generation for Bimble elements"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
rayon.workspace = true
bimble-core.workspace = true
earcutr.workspace = true
# Gzip of view files (ADR 0040); pure Rust, already in the tree.
flate2.workspace = true

# The kernel is C++: linked natively; in a browser its own WebAssembly build is called through
# JavaScript (ADR 0020).
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
manifold-csg.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen.workspace = true
js-sys.workspace = true
