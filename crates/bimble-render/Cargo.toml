[package]
name = "bimble-render"
description = "Drawing-style wgpu renderer for Bimble scenes"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
log.workspace = true
bimble-core.workspace = true
bimble-geom.workspace = true
wgpu.workspace = true
bytemuck.workspace = true
glam.workspace = true
pollster.workspace = true
png.workspace = true
serde.workspace = true
serde_json.workspace = true

[dev-dependencies]
naga = { workspace = true, features = ["wgsl-in", "glsl-out"] }

# In browsers: WebGPU where it exists, WebGL2 otherwise.
[target.'cfg(target_arch = "wasm32")'.dependencies]
wgpu = { workspace = true, features = ["webgpu", "webgl"] }
