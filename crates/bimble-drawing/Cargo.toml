[package]
name = "bimble-drawing"
description = "Drawings on paper: storey plans at scale, written as SVG and PDF"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
bimble-core.workspace = true
bimble-geom.workspace = true
pdf-writer.workspace = true
resvg.workspace = true
skrifa.workspace = true
flate2.workspace = true
dxf.workspace = true
lopdf.workspace = true
serde.workspace = true
serde_json.workspace = true

# lopdf's random numbers (encrypted PDFs) come from the browser in the web build.
[target.'cfg(target_arch = "wasm32")'.dependencies]
lopdf = { workspace = true, features = ["wasm_js"] }
