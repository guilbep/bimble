[package]
name = "bimble-drawing"
description = "Drawings on paper: storey plans at scale, written as SVG and PDF"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = ["reference-plans"]
# Reading DXF and PDF reference plans (ADR 0021). Off in the web viewer build (ADR 0050).
reference-plans = ["dep:dxf", "dep:lopdf"]

[dependencies]
bimble-core.workspace = true
bimble-geom.workspace = true
pdf-writer.workspace = true
resvg.workspace = true
skrifa.workspace = true
flate2.workspace = true
dxf = { workspace = true, optional = true }
lopdf = { workspace = true, optional = true }
serde.workspace = true
serde_json.workspace = true

# lopdf's random numbers (encrypted PDFs) come from the browser in the web build.
[target.'cfg(target_arch = "wasm32")'.dependencies]
lopdf = { workspace = true, features = ["wasm_js"], optional = true }

# The PDF export tests read their output back.
[dev-dependencies]
lopdf.workspace = true
