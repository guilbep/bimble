[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.0.1"
edition = "2024"
license = "MIT"
repository = "https://github.com/guilbep/bimble"

[workspace.dependencies]
bimble-core = { path = "crates/bimble-core" }
bimble-geom = { path = "crates/bimble-geom" }
bimble-ifc = { path = "crates/bimble-ifc" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
blake3 = "1"
uuid = { version = "1", features = ["v4"] }
earcutr = "0.5"
clap = { version = "4", features = ["derive"] }
thiserror = "2"
