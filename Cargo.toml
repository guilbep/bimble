[workspace]
resolver = "3"
members = ["crates/bimble-core", "crates/bimble-geom", "crates/bimble-ifc", "crates/bimble-render", "crates/bimble-viewer", "crates/bimble-cli"]

[workspace.package]
version = "0.1.1"
edition = "2024"
license = "MIT"
repository = "https://github.com/guilbep/bimble"

[workspace.dependencies]
bimble-core = { path = "crates/bimble-core" }
bimble-geom = { path = "crates/bimble-geom" }
bimble-ifc = { path = "crates/bimble-ifc" }
bimble-render = { path = "crates/bimble-render" }
bimble-viewer = { path = "crates/bimble-viewer" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
blake3 = "1"
uuid = { version = "1", features = ["v4"] }
earcutr = "0.5"
clap = { version = "4", features = ["derive"] }
thiserror = "2"
wgpu = "30"
bytemuck = { version = "1", features = ["derive"] }
glam = "0.34"
pollster = "1"
png = "0.18"
eframe = { version = "0.37", default-features = false, features = ["wgpu", "default_fonts", "x11", "wayland", "accesskit"] }
rfd = "0.17"
