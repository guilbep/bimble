# GitHub Pages (ADR 0020, ADR 0072). Two labs in one site (the owner's decision of 26 Nov 2026:
# the C lab is the site root, the Rust lab moves under rust/):
#   - the site root: the C core's lab (ticket PG1, ccore/README.md), web-ui on the C wasm (`npm run
#     build:ccore`), from main (a push) or the input `ccore_ref` (a manual run, default main);
#   - rust/: the last Rust release (v0.19.0, the frozen oracle of ADR 0067), as it was: the Vue lab
#     (web-ui) of the release's tag on the editor wasm of the release's web zip, the egui page of
#     the zip under rust/egui/. Nothing is compiled: the wasm comes from the release assets, the
#     page from the tag's web-ui sources (main has no Rust since ADR 0072);
#   - c/ and egui/: one page each that sends an old link on (c/ to the root, egui/ to rust/egui/),
#     with its query and fragment.
# The site is one artifact per deployment, so a lab not built here disappears at the next one. A
# failed C build fails the site job: nothing is deployed, the published site stays as it was (the
# root cannot be published empty).
#
# Deployment only from main (FIXDOC): a manual run started on another branch builds every job but
# skips `deploy` (its ref must be refs/heads/main).
#
# A manual run can also publish one pull request's C lab under preview/pr-<number>/ (input
# `preview_pr`), to open a branch on a phone before it is merged. The next deployment without that
# input removes it. Only someone who can run workflows here can start it.
# RISK (FIXDOC, docs/adr/0073-pages-previews.md): the preview is served from the production origin
# (guilbep.github.io). Its JavaScript shares that origin's storage (localStorage, IndexedDB) with
# the published labs (the C lab keeps its settings in localStorage), and runs with the origin's
# trust, so a pull request's code can read or change what the labs keep there. Start a preview only for a pull request whose code you have read.
# The ADR lists the options; the choice is the owner's.
#
# Runs on a push to main that changes the lab, and by hand. Both start from the default branch,
# which the `github-pages` environment accepts by default (a tag push would not).
#
# The site root is the newest release whose tag is v<digits>… (the Rust releases), never a C
# prerelease ccore-v* (it has no *-web.zip). The input `tag` overrides it.
#
# Two jobs, `site` (builds and uploads the artifact github-pages) then `deploy` (deploy-pages
# only). On 25 Nov deploy-pages@v4 failed in 5 of its 6 runs with "No artifacts named "github-pages" were
# found for this workflow run" when it ran in the job that had uploaded the artifact: it lists the
# run's artifacts (ListArtifacts, artifact service) 0.3-0.4 s after the upload is finalized, the
# list does not show the new artifact yet (it did 7 min later), and it does not retry (v4.0.5 and
# v5.0.1 alike). A separate job starts many seconds later, and waits until the run lists one.
# After a failure, start a FRESH run (Actions > pages > Run workflow). Never "Re-run all jobs": the
# re-run uploads a second github-pages artifact in the same run and deploy-pages then fails with
# "Multiple artifacts named github-pages". "Re-run failed jobs" is safe only when `site` succeeded.
name: pages

on:
  push:
    branches: [main]
    paths:
      - "ccore/**"
      - "web-ui/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release to publish, e.g. v0.5.0 (empty: the newest release tagged v<digits>, not ccore-v*)"
        required: false
      preview_pr:
        description: "Also publish this pull request's C lab under preview/pr-<number>/ (a number, optional)"
        required: false
      ccore_ref:
        description: "Branch, tag or commit of the C lab published under c/ (empty: main)"
        required: false

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # The pull request's C lab, built without any right to deploy: its code runs here, not in
  # `deploy`. As `ccore_lab` below, on the pull request's head commit.
  preview:
    if: github.event_name == 'workflow_dispatch' && inputs.preview_pr != ''
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: The pull request's head
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ inputs.preview_pr }}
        run: |
          [[ "$PR" =~ ^[0-9]+$ ]] || { echo "preview_pr must be a number"; exit 1; }
          SHA=$(gh pr view "$PR" --repo "$GITHUB_REPOSITORY" --json headRefOid --jq .headRefOid)
          echo "PR $PR at $SHA"
          echo "SHA=$SHA" >> "$GITHUB_ENV"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0 (v4 on 26 Nov 2026)
        with:
          ref: ${{ env.SHA }}
          path: src
          persist-credentials: false
      - run: src/scripts/apt-install.sh clang lld
        timeout-minutes: 12
      - name: binaryen (wasm-opt)
        run: |
          src/ccore/ci/binaryen.sh "$HOME/.local/binaryen"
          echo "$HOME/.local/binaryen/bin" >> "$GITHUB_PATH"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0 (v4 on 26 Nov 2026)
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: src/web-ui/package-lock.json
      - name: The pull request's C lab
        run: |
          cd src/web-ui
          npm ci --no-audit --no-fund
          npm run build:ccore -- --outDir ../../preview --emptyOutDir
          test -f ../../preview/index.html && test -f ../../preview/ccore/ccore.wasm
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2 (v4 on 26 Nov 2026)
        with:
          name: preview
          path: preview
          retention-days: 1

  # The C core's lab (ticket PG1), built without any right to deploy, on every run.
  # The C wasm needs clang and lld (wasm-ld).
  ccore_lab:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0 (v4 on 26 Nov 2026)
        with:
          ref: ${{ inputs.ccore_ref || (github.event_name == 'push' && github.sha) || 'main' }}
          path: src
          persist-credentials: false
      - run: src/scripts/apt-install.sh clang lld
        timeout-minutes: 12
      # wasm-opt: build.sh wasm-view needs it (the view wasm's size budget, ADR 0069); pinned version.
      - name: binaryen (wasm-opt)
        run: |
          src/ccore/ci/binaryen.sh "$HOME/.local/binaryen"
          echo "$HOME/.local/binaryen/bin" >> "$GITHUB_PATH"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0 (v4 on 26 Nov 2026)
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: src/web-ui/package-lock.json
      - name: The Vue lab on the C wasm (ccore.wasm and ccore-view.wasm)
        run: |
          cd src/web-ui
          npm ci --no-audit --no-fund
          npm run build:ccore -- --outDir ../../ccore-lab --emptyOutDir
          test -f ../../ccore-lab/index.html && test -f ../../ccore-lab/ccore/ccore.wasm && test -f ../../ccore-lab/ccore/ccore-view.wasm
          # URL1 (ADR 0086): the samples a link opens (?open=samples/frame.ifc), copied from ccore/golden/ by copy-ccore.mjs
          test -f ../../ccore-lab/samples/frame.ifc && test -f ../../ccore-lab/samples/frame.bimbleview
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2 (v4 on 26 Nov 2026)
        with:
          name: ccore-lab
          path: ccore-lab
          retention-days: 1

  # The site, built and uploaded as the artifact github-pages. No right to deploy here.
  site:
    needs: [preview, ccore_lab]
    # `always()`: `preview` is skipped on every run but a manual one that asks for it; a failed
    # preview stops the deployment. A failed `ccore_lab` fails this job (step "No C lab this
    # time"): the root is the C lab.
    if: always() && needs.preview.result != 'failure' && needs.preview.result != 'cancelled'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: The release's web zip
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || '' }}
        run: |
          # The newest release tagged v<digits>: `gh release list` is newest first, and the C
          # prereleases (ccore-v*) have no *-web.zip.
          if [[ -z "$TAG" ]]; then
            TAG=$(gh release list --repo "$GITHUB_REPOSITORY" --exclude-drafts --limit 100 --json tagName \
              --jq '[.[].tagName | select(test("^v[0-9]"))][0] // empty')
          fi
          [[ -n "$TAG" ]] || { echo "::error::no release tagged v<digits>"; exit 1; }
          echo "Publishing $TAG"
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern '*-web.zip' --dir zip
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          mkdir -p web/dist && unzip -q zip/*-web.zip -d web/dist
          test -f web/dist/editor/bimble_web.js
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0 (v4 on 26 Nov 2026)
        with:
          ref: ${{ env.TAG }}
          path: src
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0 (v4 on 26 Nov 2026)
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: src/web-ui/package-lock.json
      - name: The Rust lab under rust/ (the Vue lab on the release's wasm, egui page under rust/egui/)
        run: |
          mkdir -p src/web && mv web/dist src/web/dist
          cd src/web-ui
          npm ci --no-audit --no-fund
          npm run wasm
          npm run build -- --base ./ --outDir ../../site/rust --emptyOutDir
          mv ../web/dist ../../site/rust/egui
          test -f ../../site/rust/index.html && test -f ../../site/rust/bimble/bimble_web.js && test -f ../../site/rust/egui/index.html
      - name: The pull request's C lab under preview/pr-<number>/
        if: needs.preview.result == 'success'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0 (v4 on 26 Nov 2026)
        with:
          name: preview
          path: site/preview/pr-${{ inputs.preview_pr }}
      - name: No C lab this time
        if: needs.ccore_lab.result != 'success'
        env:
          RESULT: ${{ needs.ccore_lab.result }}
        run: |
          echo "::error::ccore_lab $RESULT: no deployment (the site root is the C lab; the published site stays as it was)"
          exit 1
      - name: The C lab at the site root
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0 (v4 on 26 Nov 2026)
        with:
          name: ccore-lab
          path: site
      - name: Old links (c/ and egui/) are sent on
        run: |
          test -f site/index.html && test -f site/ccore/ccore.wasm && test -f site/rust/index.html
          # The C lab must not own these names: a page of its own there would be replaced.
          test ! -e site/c && test ! -e site/egui
          forward() { # <folder> <relative target>
            mkdir -p "site/$1"
            cat > "site/$1/index.html" <<HTML
          <!doctype html>
          <meta charset="utf-8">
          <title>Bimble</title>
          <meta name="robots" content="noindex">
          <script>location.replace("$2" + location.search + location.hash)</script>
          <noscript><meta http-equiv="refresh" content="0; url=$2"></noscript>
          <p><a href="$2">Bimble has moved here.</a></p>
          HTML
          }
          forward c ../
          forward egui ../rust/egui/
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1 (v3 on 26 Nov 2026)
        with:
          path: site

  # deploy-pages alone, in its own job (see the header): it needs pages and id-token; actions: read
  # is for the wait below (the REST list of the run's artifacts), not for deploy-pages.
  deploy:
    needs: [site]
    # FIXDOC: only a run on main deploys; a manual run on another branch stops after `site`.
    if: always() && needs.site.result == 'success' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
      actions: read
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Wait until the run lists one github-pages artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for i in $(seq 1 24); do
            n=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?name=github-pages" --jq '.total_count')
            echo "try $i: $n artifact(s) named github-pages"
            if [[ $n == 1 ]]; then sleep 5; exit 0; fi
            if [[ $n -gt 1 ]]; then
              echo "::error::$n artifacts named github-pages: this is a re-run of all jobs. Start a fresh run instead."
              exit 1
            fi
            sleep 5
          done
          echo "::warning::the run lists no github-pages artifact after 2 min; trying deploy-pages anyway"
      - id: deploy
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5 (v4 on 26 Nov 2026)
