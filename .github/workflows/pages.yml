# The browser version on GitHub Pages (ADR 0020): the web zip of the latest release.
#
# It runs after the release workflow, not inside it: a workflow started by a tag can't deploy to
# the `github-pages` environment, which by default accepts deployments from the default branch
# only. `workflow_run` and manual runs start from the default branch, so no setting is needed.
name: pages

on:
  workflow_run:
    workflows: [release]
    types: [completed]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release to publish, e.g. v0.5.0"
        required: true

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    # After a successful release run that can have published: started by a tag push (head_branch
    # is then the tag's name) or by hand (one-button release). Not after pull requests: a branch
    # named "views" once passed a "starts with v" test alone.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       (github.event.workflow_run.event == 'workflow_dispatch' ||
        (github.event.workflow_run.event == 'push' &&
         startsWith(github.event.workflow_run.head_branch, 'v'))))
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: The release's web zip
        env:
          GH_TOKEN: ${{ github.token }}
          # A tag push names its release; after a manual release run, the newest release (its
          # version isn't in the event).
          TAG: ${{ inputs.tag || (github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch) || '' }}
        run: |
          if [[ -z "$TAG" ]]; then
            TAG=$(gh release list --repo "$GITHUB_REPOSITORY" --exclude-drafts --limit 1 --json tagName --jq '.[0].tagName')
          fi
          echo "Publishing $TAG"
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern '*-web.zip' --dir zip
          mkdir site && unzip -q zip/*-web.zip -d site
          test -f site/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
