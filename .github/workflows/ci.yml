name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      # The profiles live in the root Cargo.toml (ADR 0065), and the cache key does not see them:
      # without their hash, a profile change restores a stale cache and rebuilds every dependency.
      # Only the [profile.*] sections (the end of the file) are hashed: the whole file's hash
      # changed at every release (the version line), and the next run compiled 836 crates again.
      - id: profiles
        shell: bash
        run: echo "hash=$(sed -n '/^\[profile/,$p' Cargo.toml | git hash-object --stdin)" >> "$GITHUB_OUTPUT"
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ steps.profiles.outputs.hash }}
      # A software Vulkan driver, so the renderer tests actually draw instead of skipping.
      - if: runner.os == 'Linux'
        run: scripts/apt-install.sh mesa-vulkan-drivers
        timeout-minutes: 12
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  # The renderer on OpenGL (mesa's llvmpipe through EGL), as old laptops on Linux and WebGL2 run
  # it: every pipeline must build there (issue #59). Fails if GL isn't what gets tested.
  gl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - id: profiles
        shell: bash
        run: echo "hash=$(sed -n '/^\[profile/,$p' Cargo.toml | git hash-object --stdin)" >> "$GITHUB_OUTPUT"
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ steps.profiles.outputs.hash }}
      - run: scripts/apt-install.sh libegl1 libegl-mesa0 libgl1-mesa-dri libgles2
        timeout-minutes: 12
      - run: cargo test -p bimble-render
        env:
          WGPU_BACKEND: gl

  # The browser build (ADR 0020): clippy for wasm32, then the page as a downloadable artifact.
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: clippy
      - id: profiles
        shell: bash
        run: echo "hash=$(sed -n '/^\[profile/,$p' Cargo.toml | git hash-object --stdin)" >> "$GITHUB_OUTPUT"
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ steps.profiles.outputs.hash }}
      - name: wasm-bindgen-cli (the version in Cargo.lock)
        run: |
          v=$(awk '/^name = "wasm-bindgen"$/ {getline; gsub(/version = |"/, ""); print; exit}' Cargo.lock)
          [ "$(wasm-bindgen --version 2>/dev/null | awk '{print $2}')" = "$v" ] || cargo install wasm-bindgen-cli --version "$v" --locked
      - run: cargo clippy -p bimble-web -p bimble-viewer --target wasm32-unknown-unknown -- -D warnings
      - run: scripts/build-web.sh
      - uses: actions/upload-artifact@v4
        with:
          name: bimble-web
          path: web/dist
          retention-days: 14
      # Vue lab vs the wireframes: box and style counts may only go down (web-ui/design-check/baseline.json).
      # compare.mjs launches channel "chrome": Google Chrome is on the ubuntu-latest image.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web-ui/package-lock.json
      - name: Design check against the baseline (fr, en)
        working-directory: web-ui
        run: |
          npm ci --no-audit --no-fund
          npm run wasm
          cargo run --release -p bimble-cli --bin bimble -- demo public/frame.bimble
          npm run typecheck
          npm run build
          npx vite preview --port 4230 --strictPort --host 127.0.0.1 &
          for i in $(seq 30); do curl -sf http://127.0.0.1:4230/ > /dev/null && break; sleep 1; done
          screens=$(node -e 'const s=require("./design-check/screens.json");console.log(Object.keys(s).filter(k=>k!=="_doc"&&s[k].lab).join(","))')
          for lang in fr en; do
            node design-check/compare.mjs --screen "$screens" --lang $lang --lab http://127.0.0.1:4230/ --baseline design-check/baseline.json
          done

  # Our IFC export must open correctly in a reference implementation, and our IFC reader must
  # agree with it element by element.
  ifc-oracle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ifcopenshell
      - run: scripts/apt-install.sh mesa-vulkan-drivers
        timeout-minutes: 12
      - run: cargo build --release
      # The models as JSON text (.json), which the Python checks read; .bimble is binary (ADR 0042).
      - name: Export checked by IfcOpenShell
        run: |
          ./target/release/bimble demo frame.json
          ./target/release/bimble export-ifc frame.json frame.ifc
          python -I scripts/check_ifc.py frame.json frame.ifc
      - name: IFC4 and IFC2x3 exports valid against their schemas
        run: |
          ./target/release/bimble export-ifc frame.json frame-2x3.ifc --schema 2x3
          python -I scripts/validate_ifc.py frame.ifc frame-2x3.ifc
      - name: Double hop (import → export) checked by IfcOpenShell
        run: |
          ./target/release/bimble import-ifc frame.ifc frame2.json
          ./target/release/bimble export-ifc frame2.json frame2.ifc
          python -I scripts/check_ifc.py frame2.json frame2.ifc
      - name: Reader compared with IfcOpenShell
        run: |
          ./target/release/bimble info frame.ifc --elements-json > ours.jsonl
          python -I scripts/compare_ifcopenshell.py frame.ifc ours.jsonl
      - name: Render
        run: ./target/release/bimble render frame.ifc frame.png
      - uses: actions/upload-artifact@v4
        with:
          name: demo-render
          path: frame.png

  # Performance trend (ADR 0011). The deterministic geometry budgets are a test in the rust job;
  # this job tracks wall-clock times, which are too noisy on shared runners to fail a build.
  # Pushes to main store a baseline; pull requests are compared with the latest one and get a
  # warning when a metric is more than 25 % slower. Software GPU: only relative numbers matter.
  perf:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: scripts/apt-install.sh mesa-vulkan-drivers
        timeout-minutes: 12
      - run: cargo build --release -p bimble-cli
      - name: Benchmark (3 runs, best of each metric is compared)
        run: |
          for i in 1 2 3; do
            ./target/release/bimble bench --json --frames 20 --width 640 --height 360 > bench-$i.json
          done
      - if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: bench-main
          path: bench-*.json
          retention-days: 90
      - name: Compare with the latest main baseline
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Newest unexpired bench-main artifact (only pushes to main upload one). A missing or
          # unreadable baseline never fails the job: it only skips the comparison.
          run=$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=bench-main&per_page=50" \
            --jq '[.artifacts[] | select(.expired | not) | select(.workflow_run.head_branch == "main")]
                  | sort_by(.created_at) | last | .workflow_run.id // empty' || true)
          if [ -z "$run" ] || ! gh run download "$run" -R "$GITHUB_REPOSITORY" -n bench-main -D base; then
            echo "No main baseline yet: it is created by the first push to main with this job." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "Baseline: run $run" | tee -a "$GITHUB_STEP_SUMMARY"
          # The baseline is reduced to its best run too, so both sides are compared alike.
          python3 -I scripts/bench_compare.py bench-*.json --baseline base/bench-*.json
