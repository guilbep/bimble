name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      # A software Vulkan driver, so the renderer tests actually draw instead of skipping.
      - if: runner.os == 'Linux'
        run: sudo apt-get update -q && sudo apt-get install -y -q mesa-vulkan-drivers
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  # The browser build (ADR 0020): clippy for wasm32, then the page as a downloadable artifact.
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: wasm-bindgen-cli (the version in Cargo.lock)
        run: |
          v=$(awk '/^name = "wasm-bindgen"$/ {getline; gsub(/version = |"/, ""); print; exit}' Cargo.lock)
          [ "$(wasm-bindgen --version 2>/dev/null | awk '{print $2}')" = "$v" ] || cargo install wasm-bindgen-cli --version "$v" --locked
      - run: cargo clippy -p bimble-web -p bimble-viewer --target wasm32-unknown-unknown -- -D warnings
      - run: scripts/build-web.sh
      - uses: actions/upload-artifact@v4
        with:
          name: bimble-web
          path: web/dist
          retention-days: 14

  # Our IFC export must open correctly in a reference implementation, and our IFC reader must
  # agree with it element by element.
  ifc-oracle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ifcopenshell
      - run: sudo apt-get update -q && sudo apt-get install -y -q mesa-vulkan-drivers
      - run: cargo build --release
      - name: Export checked by IfcOpenShell
        run: |
          ./target/release/bimble demo frame.bimble
          ./target/release/bimble export-ifc frame.bimble frame.ifc
          python -I scripts/check_ifc.py frame.bimble frame.ifc
      - name: Double hop (import → export) checked by IfcOpenShell
        run: |
          ./target/release/bimble import-ifc frame.ifc frame2.bimble
          ./target/release/bimble export-ifc frame2.bimble frame2.ifc
          python -I scripts/check_ifc.py frame2.bimble frame2.ifc
      - name: Reader compared with IfcOpenShell
        run: |
          ./target/release/bimble info frame.ifc --elements-json > ours.jsonl
          python -I scripts/compare_ifcopenshell.py frame.ifc ours.jsonl
      - name: Render
        run: ./target/release/bimble render frame.ifc frame.png
      - uses: actions/upload-artifact@v4
        with:
          name: demo-render
          path: frame.png

  # Performance trend (ADR 0011). The deterministic geometry budgets are a test in the rust job;
  # this job tracks wall-clock times, which are too noisy on shared runners to fail a build.
  # Pushes to main store a baseline; pull requests are compared with the latest one and get a
  # warning when a metric is more than 25 % slower. Software GPU: only relative numbers matter.
  perf:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update -q && sudo apt-get install -y -q mesa-vulkan-drivers
      - run: cargo build --release -p bimble-cli
      - name: Benchmark (3 runs, best of each metric is compared)
        run: |
          for i in 1 2 3; do
            ./target/release/bimble bench --json --frames 20 --width 640 --height 360 > bench-$i.json
          done
      - if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: bench-main
          path: bench-*.json
          retention-days: 90
      - name: Compare with the latest main baseline
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Newest unexpired bench-main artifact (only pushes to main upload one). A missing or
          # unreadable baseline never fails the job: it only skips the comparison.
          run=$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=bench-main&per_page=50" \
            --jq '[.artifacts[] | select(.expired | not) | select(.workflow_run.head_branch == "main")]
                  | sort_by(.created_at) | last | .workflow_run.id // empty' || true)
          if [ -z "$run" ] || ! gh run download "$run" -R "$GITHUB_REPOSITORY" -n bench-main -D base; then
            echo "No main baseline yet: it is created by the first push to main with this job." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "Baseline: run $run" | tee -a "$GITHUB_STEP_SUMMARY"
          # The baseline is reduced to its best run too, so both sides are compared alike.
          python3 -I scripts/bench_compare.py bench-*.json --baseline base/bench-*.json
