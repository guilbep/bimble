# The web page's timed budgets: `make perf-web` builds the release wasm and the CLI, makes
# synthetic fixtures, runs Lighthouse on the runner's Chrome and fails when a median is more than
# 15 % over its budget (web-ui/perf/budgets.txt). Nightly, by hand, and on a pull request
# labelled perf: not on every push, where a shared runner's clock noise would be read as a
# regression. The deterministic geometry budgets run in every `cargo test` (ci.yml).
name: perf

on:
  schedule:
    - cron: "23 2 * * *"
  pull_request:
    types: [labeled, synchronize]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: perf-${{ github.ref }}
  cancel-in-progress: true

jobs:
  perf-web:
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'perf')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: wasm-bindgen-cli (the version in Cargo.lock)
        run: |
          v=$(awk '/^name = "wasm-bindgen"$/ {getline; gsub(/version = |"/, ""); print; exit}' Cargo.lock)
          [ "$(wasm-bindgen --version 2>/dev/null | awk '{print $2}')" = "$v" ] || cargo install wasm-bindgen-cli --version "$v" --locked
      # ponytail: CMake and g++ (manifold) are on the ubuntu-latest image; add
      # scripts/apt-install.sh cmake g++ if the image drops them.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web-ui/package-lock.json
      - name: make perf-web (Lighthouse on the image's Chrome)
        run: |
          CHROME_PATH=$(command -v google-chrome || command -v google-chrome-stable)
          export CHROME_PATH
          make perf-web
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: perf-results
          path: perf-results/
          retention-days: 30
      - if: always()
        run: test -f perf-results/report.md && cat perf-results/report.md >> "$GITHUB_STEP_SUMMARY" || true
