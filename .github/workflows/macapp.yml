name: macapp
# The native app `bimble` on macOS (ticket MACAPP, ADR 0088): build, bundle, disk image and the offscreen tests on
# GitHub's macOS runners, alone and cheap (minutes, not the whole CI), so a change to the mac app is one round trip.
# Rows: arm64 on macos-15 (Apple Silicon, a paravirtual Metal device); x86_64 built on the same arm64 runner
# (CMAKE_OSX_ARCHITECTURES, as ccore-release) and run under Rosetta 2; x86_64 on macos-15-intel natively (a probe:
# which Metal device an Intel runner has, if any). Then the universal image's size (lipo of the two), measured.
# Every step that can fail on a runner without a GPU says so and goes on (the logs, pictures and images are uploaded
# whatever happened); the job fails on the build, the image test and the tests marked required below.
# On a manual run, a pull request that touches the mac app (paths), and never on a tag (ccore.yml's ccore-release
# makes the release's images).
permissions:
  contents: read

on:
  workflow_dispatch:
  pull_request:
    branches: [main, next]
    paths:
      - "ccore/native/**"
      - "ccore/ci/sdl3.sh"
      - "ccore/test/macapp_test.mjs"
      - ".github/workflows/macapp.yml"

concurrency:
  group: macapp-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macapp:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-15, arch: arm64, name: arm64 }
          - { os: macos-15, arch: x86_64, name: x86_64-rosetta }
          - { os: macos-15-intel, arch: x86_64, name: x86_64-intel, probe: true }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    continue-on-error: ${{ matrix.probe == true }}
    env:
      CMAKE_OSX_ARCHITECTURES: ${{ matrix.arch }}
      MACOSX_DEPLOYMENT_TARGET: "11.0"
      MACAPP_ARCH: ${{ matrix.arch }}
      PKG_CONFIG_PATH: /Users/runner/.local/macdeps/lib/pkgconfig
      OUT: ccore/out/macapp-ci
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0 (v4 on 26 Nov 2026)
      - name: Versions, the GPU, Metal
        id: keys
        run: |
          mkdir -p "$OUT"
          echo "manifold=$(sed -n 's/^MANIFOLD_TAG=\([^ ]*\).*/\1/p' ccore/deps.sh)" >> "$GITHUB_OUTPUT"
          { sw_vers; uname -m; sysctl -n machdep.cpu.brand_string; sysctl -n hw.memsize hw.ncpu
            clang --version | head -n 1; xcodebuild -version | tr '\n' ' '; echo
            echo "bash: $(command -v bash) $BASH_VERSION"; for t in pkg-config cmake perl shasum sha256sum xxd; do printf '%-10s %s\n' "$t" "$(command -v $t || echo -)"; done
            system_profiler SPDisplaysDataType 2> /dev/null | sed -n '1,30p'
            xcrun -sdk macosx -f metal 2>&1 || echo "no metal compiler"
          } 2>&1 | tee "$OUT/versions.txt"
          cat > "$OUT/probe.m" << 'EOF'
          #import <Metal/Metal.h>
          #include <stdio.h>
          int main(void) {
              NSArray<id<MTLDevice>> *all = MTLCopyAllDevices();
              printf("metal probe: %lu device(s)\n", (unsigned long)all.count);
              for (id<MTLDevice> d in all)
                  printf("  %s: Mac2 %d, Apple7 %d, low power %d, headless %d, unified %d, max buffer %llu MB, rw texture tier %d\n",
                         d.name.UTF8String, [d supportsFamily:MTLGPUFamilyMac2], [d supportsFamily:MTLGPUFamilyApple7], d.lowPower,
                         d.headless, d.hasUnifiedMemory, (unsigned long long)(d.maxBufferLength >> 20), (int)d.readWriteTextureSupport);
              id<MTLDevice> def = MTLCreateSystemDefaultDevice();
              printf("metal probe: default device %s\n", def ? def.name.UTF8String : "NONE");
              return def ? 0 : 3;
          }
          EOF
          clang -arch "$MACAPP_ARCH" -fobjc-arc -framework Metal -framework Foundation "$OUT/probe.m" -o "$OUT/probe"
          if [[ $MACAPP_ARCH == x86_64 && $(uname -m) == arm64 ]]; then
            arch -x86_64 /usr/bin/true 2> /dev/null || sudo softwareupdate --install-rosetta --agree-to-license > /dev/null
            arch -x86_64 "$OUT/probe" | tee -a "$OUT/versions.txt" || echo "metal probe (Rosetta): no device" | tee -a "$OUT/versions.txt"
          else "$OUT/probe" | tee -a "$OUT/versions.txt" || echo "metal probe: no device" | tee -a "$OUT/versions.txt"; fi
      # The committed MSL compiled by Apple's own Metal compiler (when the image has it): every shader, before the app
      # compiles them at run time (SDL's Metal backend takes MSL source). A finding, not a gate (the app's run is).
      - name: MSL compiled by xcrun metal
        continue-on-error: true
        run: |
          xcrun -sdk macosx -f metal > /dev/null 2>&1 || { echo "skipped: no Metal compiler in this image (xcodebuild -downloadComponent MetalToolchain)"; exit 0; }
          mkdir -p "$OUT/msl"; ok=0 bad=0
          for h in ccore/native/shaders/gen/*.msl.h; do
            b=$(basename "$h" .msl.h)
            perl -ne 'next if $. <= 2; s/^"//; s/\\n"\s*$/\n/; s/\\"/"/g; s/\\\\/\\/g; print' "$h" > "$OUT/msl/$b.metal"
            if xcrun -sdk macosx metal -std=macos-metal2.0 -mmacosx-version-min=11.0 -c "$OUT/msl/$b.metal" -o "$OUT/msl/$b.air" 2> "$OUT/msl/$b.log"; then ok=$((ok+1)); else bad=$((bad+1)); echo "FAIL $b"; cat "$OUT/msl/$b.log"; fi
          done
          echo "xcrun metal: $ok compiled, $bad failed"
          ((bad == 0))
      - run: command -v pkg-config > /dev/null || brew install pkgconf
      - name: SDL 3, brotli, FreeType static (cache)
        id: macdeps
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0 (v4 on 26 Nov 2026)
        with:
          path: ~/.local/macdeps
          key: macdeps-${{ matrix.os }}-${{ matrix.arch }}-${{ hashFiles('ccore/ci/sdl3.sh', 'ccore/native/macos/deps.sh') }}
      - if: steps.macdeps.outputs.cache-hit != 'true'
        run: ccore/native/macos/deps.sh ~/.local/macdeps
      - name: manifold (cache)
        id: manifold
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0 (v4 on 26 Nov 2026)
        with:
          path: ccore/out/deps/manifold
          key: manifold-macapp-${{ matrix.os }}-${{ matrix.arch }}-${{ steps.keys.outputs.manifold }}-${{ hashFiles('ccore/deps.sh', 'ccore/portable.sh') }}
      - if: steps.manifold.outputs.cache-hit != 'true'
        run: JOBS=4 ccore/deps.sh
      - name: ImGui, cimgui, nanosvg (cache; checked by native/deps.sh)
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0 (v4 on 26 Nov 2026)
        with:
          path: ccore/out/native/deps
          key: native-deps-${{ hashFiles('ccore/native/deps.sh') }}
      - name: native/build.sh shaders --check, native/deps.sh
        run: |
          ccore/native/build.sh shaders --check
          ccore/native/deps.sh
          ccore/native/deps.sh --check
      - name: native/build.sh app
        run: ccore/native/build.sh app 2>&1 | tee "$OUT/build.log"
      - name: bimble.app and the disk image (the formats measured)
        working-directory: ccore
        run: |
          for f in UDZO ULMO ULFO; do DMG_FORMAT=$f native/macos/bundle.sh | tee -a "../$OUT/bundle.log"; done
          ls -l out/macapp | tee -a "../$OUT/bundle.log"
      - name: test/macapp_test.mjs (the image)
        working-directory: ccore
        run: node test/macapp_test.mjs 2>&1 | tee "../$OUT/macapp_test.log"
      # The app on the runner's GPU. Under Rosetta (x86_64 on arm64) every run goes through `arch -x86_64`.
      - name: The GPU path (selftest, a shot with Metal's validation, orbit-zoom)
        id: gpu
        continue-on-error: true
        working-directory: ccore
        run: |
          B=out/app/bimble
          [[ $MACAPP_ARCH == x86_64 && $(uname -m) == arm64 ]] && B="arch -x86_64 out/app/bimble"
          O=../$OUT
          set +e
          $B --selftest-window > "$O/selftest.txt" 2>&1; echo "selftest-window: exit $?" >> "$O/selftest.txt"; cat "$O/selftest.txt"
          MTL_DEBUG_LAYER=1 MTL_SHADER_VALIDATION=1 BIMBLE_LOG_DIR="$O/logs-shot" $B --offscreen --quit-after 2 --config-dir "$O/conf" \
            --shot "$O/shot-fixture.png" golden/frame.json > "$O/shot.txt" 2>&1; echo "shot (Metal validation): exit $?" >> "$O/shot.txt"; tail -40 "$O/shot.txt"
          BIMBLE_LOG_DIR="$O/logs-orbit" $B --offscreen --preset orbit-zoom --out "$O/orbit-zoom" --config-dir "$O/conf" golden/frame.json \
            > "$O/orbit.txt" 2>&1; echo "orbit-zoom: exit $?" >> "$O/orbit.txt"; tail -20 "$O/orbit.txt"
          cat "$O/orbit-zoom/summary.md" 2> /dev/null || echo "no summary.md"
          BIMBLE_LOG_DIR="$O/logs-truth" $B --offscreen --truth --preset orbit-zoom --out "$O/truth" --config-dir "$O/conf" golden/frame.json \
            > "$O/truth.txt" 2>&1; echo "truth: exit $?" >> "$O/truth.txt"; tail -20 "$O/truth.txt"
      - name: test/native_app_test.mjs, test/native_geo_test.mjs (Metal)
        id: suites
        continue-on-error: true
        working-directory: ccore
        run: |
          if [[ $MACAPP_ARCH == x86_64 && $(uname -m) == arm64 ]]; then
            printf '#!/bin/sh\nexec arch -x86_64 "%s" "$@"\n' "$PWD/out/app/bimble" > out/app/bimble-rosetta && chmod +x out/app/bimble-rosetta
            export NATIVE_BIN=$PWD/out/app/bimble-rosetta
          fi
          rc=0
          NATIVE_TMP=$PWD/../$OUT node test/native_app_test.mjs 2>&1 | tee "../$OUT/native_app_test.log"; rc=$((rc | PIPESTATUS[0]))
          NATIVE_TMP=$PWD/../$OUT node test/native_geo_test.mjs 2>&1 | tee "../$OUT/native_geo_test.log"; rc=$((rc | PIPESTATUS[0]))
          exit $rc
      - name: Summary
        if: always()
        run: |
          {
            echo "### macapp ${{ matrix.name }}"
            echo '```'
            grep -E "metal probe|default device|Mac2" "$OUT/versions.txt" || true
            grep -E "^native/build.sh app" "$OUT/build.log" || true
            grep -E "bytes|signed" "$OUT/bundle.log" || true
            grep -E "macapp_test:|FAIL" "$OUT/macapp_test.log" || true
            grep -E "selftest-window: (video|GPU|claimed|size|ok|FAILED|exit)" "$OUT/selftest.txt" 2> /dev/null || true
            grep -E "exit|first picture|FAIL|refused|error" "$OUT/shot.txt" "$OUT/orbit.txt" "$OUT/truth.txt" 2> /dev/null | head -30 || true
            grep -E "passed|skipped|FAIL" "$OUT/native_app_test.log" "$OUT/native_geo_test.log" 2> /dev/null | head -40 || true
            echo '```'
            echo "gpu step: ${{ steps.gpu.outcome }}, suites: ${{ steps.suites.outcome }}"
          } >> "$GITHUB_STEP_SUMMARY"
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2 (v4 on 26 Nov 2026)
        with:
          name: macapp-${{ matrix.name }}
          path: |
            ccore/out/macapp-ci/
            ccore/out/macapp/*.dmg
            ccore/out/macapp/*.dSYM.zip
            !ccore/out/macapp-ci/**/*.bimble
          retention-days: 14
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2 (v4 on 26 Nov 2026)
        with:
          name: macapp-bin-${{ matrix.name }}
          path: ccore/out/app/bimble
          retention-days: 7

  # Two images or one universal image: the universal one made from the two executables (lipo), measured beside them.
  macapp-universal:
    needs: macapp
    if: always()
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0 (v4 on 26 Nov 2026)
        with:
          pattern: macapp-*
          path: in
      - name: lipo, then the same bundle and image
        run: |
          ls -lR in | grep -E "\.dmg|bimble$" || true
          a=in/macapp-bin-arm64/bimble x=in/macapp-bin-x86_64-rosetta/bimble
          [[ -f $a && -f $x ]] || { echo "skipped: an architecture's executable is missing"; exit 0; }
          dmg=$(ls in/macapp-arm64/out/macapp/*-macos-arm64.dmg 2> /dev/null | head -1 || true)
          [[ -n $dmg ]] || dmg=$(find in/macapp-arm64 -name '*-macos-arm64.dmg' | head -1)
          mnt=$(mktemp -d); hdiutil attach -nobrowse -readonly -mountpoint "$mnt" "$dmg" > /dev/null
          st=$(mktemp -d); cp -R "$mnt/bimble.app" "$mnt/README.txt" "$st/"; ln -s /Applications "$st/Applications"; hdiutil detach -quiet "$mnt"
          lipo -create "$a" "$x" -output "$st/bimble.app/Contents/MacOS/bimble"
          codesign --force --sign - "$st/bimble.app" && codesign --verify --strict "$st/bimble.app"
          out=$(basename "$dmg" | sed 's/-arm64\.dmg$/-universal.dmg/')
          hdiutil create -quiet -volname "Bimble" -srcfolder "$st" -fs HFS+ -format ULFO -ov "$out"
          {
            echo "### Two images or one"
            echo '```'
            printf '%-40s %10s\n' "arm64 executable" "$(wc -c < "$a")"
            printf '%-40s %10s\n' "x86_64 executable" "$(wc -c < "$x")"
            printf '%-40s %10s\n' "universal executable" "$(wc -c < "$st/bimble.app/Contents/MacOS/bimble")"
            for f in $(find in -name '*.dmg') "$out"; do printf '%-40s %10s\n' "$(basename "$f")" "$(wc -c < "$f")"; done
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
