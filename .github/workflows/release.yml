name: release

# Ways to publish (docs/RELEASING.md, ADR 0022):
#   - Actions → release → Run workflow with `version: X.Y.Z`: sets the version in Cargo.toml and
#     Cargo.lock, commits that to main, tags vX.Y.Z, builds and publishes (the usual way);
#   - push a tag v* whose version is already in Cargo.toml (or create the release on GitHub);
#   - run by hand with `tag: vX.Y.Z` to (re)build an existing tag and attach the archives.
# Pull requests and manual runs without a version or tag build the same archives as artifacts.
on:
  push:
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, e.g. 0.7.0: bumps Cargo.toml, commits to main, tags, builds, publishes"
        required: false
        default: ""
      tag:
        description: "Existing tag to build and attach to its release (e.g. v0.1.0). Empty: build only."
        required: false
        default: ""

permissions:
  contents: read

env:
  # The tag being released, if any: from a manual run's input, or from a tag push.
  RELEASE_TAG: ${{ (inputs.version && format('v{0}', inputs.version)) || inputs.tag || (startsWith(github.ref, 'refs/tags/v') && github.ref_name) || '' }}

jobs:
  # One-button release: the version goes into Cargo.toml and Cargo.lock on main, then the tag.
  # The tag is pushed with the workflow's token, which starts no other workflow: this run builds it.
  prepare:
    if: ${{ inputs.version != '' && inputs.version != null }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ inputs.version }}
    steps:
      - name: Only from main
        if: github.ref != 'refs/heads/main'
        run: echo "::error::Run the release from main (it commits the version there)." && exit 1
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - name: Check the version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "::error::'$VERSION' is not a version like 0.7.0 (no leading v)." && exit 1
          fi
          if gh release view "v$VERSION" > /dev/null 2>&1; then
            echo "::error::Release v$VERSION already exists. To rebuild it, run with tag: v$VERSION." && exit 1
          fi
          # A tag without a release is a release that didn't happen (e.g. tagged before the
          # bump): it is moved to the commit released now.
          if git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" > /dev/null; then
            echo "::warning::Tag v$VERSION existed without a release; it is moved to this release's commit."
            git push origin ":refs/tags/v$VERSION"
          fi
      - name: Set the version, commit, tag
        run: |
          current=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [[ "$current" != "$VERSION" ]]; then
            sed -i "0,/^version = \"$current\"/s//version = \"$VERSION\"/" Cargo.toml
            cargo update --workspace
            changed=$(git diff --name-only | sort | tr '\n' ' ')
            if [[ "$changed" != "Cargo.lock Cargo.toml " ]]; then
              echo "::error::Expected only Cargo.toml and Cargo.lock to change, got: $changed" && exit 1
            fi
            git commit -am "Version $VERSION"
            git push origin HEAD:main
          fi
          git tag "v$VERSION"
          git push origin "v$VERSION"

  build:
    needs: prepare
    # Runs when there was nothing to prepare (prepare skipped) or it succeeded.
    if: ${{ !cancelled() && needs.prepare.result != 'failure' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Oldest supported Ubuntu runner: a lower glibc so the binary runs on more distros.
          - { os: ubuntu-22.04, target: x86_64-unknown-linux-gnu, ext: tar.gz, run: true }
          - { os: macos-15, target: aarch64-apple-darwin, ext: tar.gz, run: true }
          - { os: macos-15, target: x86_64-apple-darwin, ext: tar.gz, run: false }
          - { os: windows-latest, target: x86_64-pc-windows-msvc, ext: zip, run: true }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          # Build the tagged source, even when this workflow file comes from a newer branch.
          ref: ${{ env.RELEASE_TAG || github.ref }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Version
        id: v
        run: |
          crate=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          if [[ -n "$RELEASE_TAG" ]]; then
            tag="${RELEASE_TAG#v}"
            if [[ "$tag" != "$crate" ]]; then
              echo "::error::Tag $RELEASE_TAG does not match Cargo.toml version $crate. Bump the version in Cargo.toml first, then tag (see docs/RELEASING.md)."
              exit 1
            fi
            echo "name=$crate" >> "$GITHUB_OUTPUT"
          else
            echo "name=$crate-dev.$(git rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"
          fi
      - name: Build
        shell: bash
        run: |
          # C++ dependencies (manifold) are built by CMake, which ignores cargo's --target on macOS
          # and builds for the runner's arch unless told otherwise (ADR 0010).
          if [[ "${{ matrix.target }}" == *apple-darwin ]]; then
            arch="${{ matrix.target }}"; arch="${arch%%-*}"; [[ "$arch" == aarch64 ]] && arch=arm64
            export CMAKE_OSX_ARCHITECTURES="$arch"
          fi
          cargo build --release --locked --target ${{ matrix.target }} -p bimble-cli
          if [[ "${{ matrix.target }}" == *apple-darwin ]]; then
            lipo -archs target/${{ matrix.target }}/release/bimble
          fi
      - name: Smoke test
        if: matrix.run
        run: |
          bin=target/${{ matrix.target }}/release/bimble
          $bin --version
          $bin demo smoke.bimble
          $bin info smoke.bimble
          $bin export-ifc smoke.bimble smoke.ifc
          $bin info smoke.ifc
      - name: Package
        id: pkg
        run: |
          name="bimble-${{ steps.v.outputs.name }}-${{ matrix.target }}"
          mkdir -p "dist/$name"
          exe=bimble; [[ "${{ matrix.target }}" == *windows* ]] && exe=bimble.exe
          cp "target/${{ matrix.target }}/release/$exe" "dist/$name/"
          cp README.md LICENSE "dist/$name/"
          cd dist
          if [[ "${{ matrix.ext }}" == zip ]]; then
            7z a -tzip "$name.zip" "$name" > /dev/null
          else
            tar czf "$name.tar.gz" "$name"
          fi
          echo "file=dist/$name.${{ matrix.ext }}" >> "$GITHUB_OUTPUT"
      # Installers (ADR 0043), unsigned: macOS .app in a .dmg (ad-hoc signed), Windows .msi,
      # Linux .deb, .rpm and AppImage. Same binary as the archive.
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-packager,cargo-generate-rpm
      - name: Installers
        run: |
          case "${{ matrix.target }}" in
            *apple-darwin) formats=app,dmg ;;
            *windows*) formats=wix ;;
            *linux*) formats=deb,appimage ;;
          esac
          cargo packager -p bimble-cli --release --target ${{ matrix.target }} -f $formats -o "$PWD/installers"
          rm -rf installers/*.app
          if [[ "${{ matrix.target }}" == *linux* ]]; then
            cargo generate-rpm -p crates/bimble-cli --target ${{ matrix.target }} -o installers/
          fi
          ls -la installers
      - uses: actions/upload-artifact@v4
        with:
          name: bimble-${{ matrix.target }}
          path: |
            ${{ steps.pkg.outputs.file }}
            installers/*.dmg
            installers/*.msi
            installers/*.deb
            installers/*.rpm
            installers/*.AppImage
          retention-days: 14

  # The browser version (ADR 0020): a zip with the page, attached to the release. pages.yml then
  # publishes that zip on GitHub Pages.
  web:
    needs: prepare
    if: ${{ !cancelled() && needs.prepare.result != 'failure' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG || github.ref }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: wasm-bindgen-cli (the version in Cargo.lock)
        run: |
          v=$(awk '/^name = "wasm-bindgen"$/ {getline; gsub(/version = |"/, ""); print; exit}' Cargo.lock)
          [ "$(wasm-bindgen --version 2>/dev/null | awk '{print $2}')" = "$v" ] || cargo install wasm-bindgen-cli --version "$v" --locked
      - run: scripts/build-web.sh
      - name: Package
        run: |
          name="bimble-${RELEASE_TAG:-dev}-web"
          mkdir -p dist && (cd web/dist && zip -r "../../dist/$name.zip" .)
      - uses: actions/upload-artifact@v4
        with:
          name: bimble-web
          path: dist/*.zip
          retention-days: 14

  publish:
    # The web zip is attached when its build worked; a failed web build (e.g. rebuilding a tag
    # older than the web version) doesn't hold back the desktop archives.
    if: ${{ always() && needs.build.result == 'success' && (inputs.version != '' || inputs.tag != '' || startsWith(github.ref, 'refs/tags/v')) }}
    needs: [build, web]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Notes template from the branch running the workflow.
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: |
          # Artifacts keep their folders (installers/): attach every file flat.
          find dist -mindepth 2 -type f -exec mv {} dist/ \;
          find dist -mindepth 1 -type d -empty -delete
          cd dist && sha256sum * > SHA256SUMS && cat SHA256SUMS
      # The release may already exist (created by hand on GitHub, which also creates the tag):
      # then attach the files and keep its title and notes.
      - name: Create release or attach to it
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$RELEASE_TAG"
          if gh release view "$tag" > /dev/null 2>&1; then
            gh release upload "$tag" dist/* --clobber
          else
            sed "s/{{VERSION}}/$tag/g" .github/release-notes.md > notes.md
            gh release create "$tag" dist/* --title "Bimble $tag" --notes-file notes.md --generate-notes --prerelease
          fi
      # Homebrew (ADR 0043): the formula in this repository points to this release's archives.
      # `brew tap guilbep/bimble https://github.com/guilbep/bimble && brew install bimble`.
      - name: Homebrew formula
        # Not when rebuilding an older tag by hand: the formula follows the newest release.
        if: ${{ inputs.tag == '' || inputs.tag == null }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git fetch origin main && git checkout -B main origin/main
          scripts/homebrew-formula.sh "${RELEASE_TAG#v}" dist/SHA256SUMS > Formula/bimble.rb
          if ! git diff --quiet Formula/bimble.rb; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Homebrew formula: $RELEASE_TAG" Formula/bimble.rb
            git push origin HEAD:main
          fi
