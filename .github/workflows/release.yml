name: release

# Ways to publish:
#   - push a tag v*  (or create the release on GitHub, which creates the tag), or
#   - run this workflow by hand with `tag: vX.Y.Z` to (re)build an existing tag and attach the
#     archives to its release.
# Pull requests and manual runs without a tag build the same archives as workflow artifacts.
on:
  push:
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build and attach to its release (e.g. v0.1.0). Empty: build only."
        required: false
        default: ""

permissions:
  contents: read

env:
  # The tag being released, if any: from a manual run's input, or from a tag push.
  RELEASE_TAG: ${{ inputs.tag || (startsWith(github.ref, 'refs/tags/v') && github.ref_name) || '' }}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Oldest supported Ubuntu runner: a lower glibc so the binary runs on more distros.
          - { os: ubuntu-22.04, target: x86_64-unknown-linux-gnu, ext: tar.gz, run: true }
          - { os: macos-14, target: aarch64-apple-darwin, ext: tar.gz, run: true }
          - { os: macos-14, target: x86_64-apple-darwin, ext: tar.gz, run: false }
          - { os: windows-latest, target: x86_64-pc-windows-msvc, ext: zip, run: true }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          # Build the tagged source, even when this workflow file comes from a newer branch.
          ref: ${{ env.RELEASE_TAG || github.ref }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Version
        id: v
        run: |
          crate=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          if [[ -n "$RELEASE_TAG" ]]; then
            tag="${RELEASE_TAG#v}"
            if [[ "$tag" != "$crate" ]]; then
              echo "::error::Tag $RELEASE_TAG does not match Cargo.toml version $crate. Bump the version in Cargo.toml first, then tag (see docs/RELEASING.md)."
              exit 1
            fi
            echo "name=$crate" >> "$GITHUB_OUTPUT"
          else
            echo "name=$crate-dev.$(git rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"
          fi
      - name: Build
        shell: bash
        run: |
          # C++ dependencies (manifold) are built by CMake, which ignores cargo's --target on macOS
          # and builds for the runner's arch unless told otherwise (ADR 0010).
          if [[ "${{ matrix.target }}" == *apple-darwin ]]; then
            arch="${{ matrix.target }}"; arch="${arch%%-*}"; [[ "$arch" == aarch64 ]] && arch=arm64
            export CMAKE_OSX_ARCHITECTURES="$arch"
          fi
          cargo build --release --locked --target ${{ matrix.target }} -p bimble-cli
          if [[ "${{ matrix.target }}" == *apple-darwin ]]; then
            lipo -archs target/${{ matrix.target }}/release/bimble
          fi
      - name: Smoke test
        if: matrix.run
        run: |
          bin=target/${{ matrix.target }}/release/bimble
          $bin --version
          $bin demo smoke.bimble
          $bin info smoke.bimble
          $bin export-ifc smoke.bimble smoke.ifc
          $bin info smoke.ifc
      - name: Package
        id: pkg
        run: |
          name="bimble-${{ steps.v.outputs.name }}-${{ matrix.target }}"
          mkdir -p "dist/$name"
          exe=bimble; [[ "${{ matrix.target }}" == *windows* ]] && exe=bimble.exe
          cp "target/${{ matrix.target }}/release/$exe" "dist/$name/"
          cp README.md LICENSE "dist/$name/"
          cd dist
          if [[ "${{ matrix.ext }}" == zip ]]; then
            7z a -tzip "$name.zip" "$name" > /dev/null
          else
            tar czf "$name.tar.gz" "$name"
          fi
          echo "file=dist/$name.${{ matrix.ext }}" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: bimble-${{ matrix.target }}
          path: ${{ steps.pkg.outputs.file }}
          retention-days: 14

  publish:
    if: ${{ inputs.tag != '' || startsWith(github.ref, 'refs/tags/v') }}
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Notes template from the branch running the workflow.
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: cd dist && sha256sum * > SHA256SUMS && cat SHA256SUMS
      # The release may already exist (created by hand on GitHub, which also creates the tag):
      # then attach the files and keep its title and notes.
      - name: Create release or attach to it
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$RELEASE_TAG"
          if gh release view "$tag" > /dev/null 2>&1; then
            gh release upload "$tag" dist/* --clobber
          else
            sed "s/{{VERSION}}/$tag/g" .github/release-notes.md > notes.md
            gh release create "$tag" dist/* --title "Bimble $tag" --notes-file notes.md --generate-notes --prerelease
          fi
