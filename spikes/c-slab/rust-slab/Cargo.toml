[package]
name = "rust-slab"
version = "0.0.0"
edition = "2024"
publish = false

# Standalone: not part of the Bimble workspace.
[workspace]

[lib]
name = "rust_slab"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "slab_dump"
path = "src/main.rs"

[dependencies]

# Like ADR 0065: line tables only in dev builds.
[profile.dev]
debug = "line-tables-only"
